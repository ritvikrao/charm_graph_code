# Correctness gate: every push must still solve SSSP exactly, and must generate
# the same graphs everywhere.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap, and it needs no Charm++ build: compile the generators and the
  # serialized-graph writer with several toolchains and check they agree, both
  # on the solved digest and on the .wsg file byte for byte. This catches the
  # class of bug where the graph itself differs between standard libraries,
  # which would silently make every cross-machine comparison meaningless.
  generator-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare generated graphs across toolchains
        run: scripts/check_generator_portability.sh

  # Full gate: solve in parallel, compare against serial Dijkstra, diff the
  # digests against the recorded golden file, and check the standalone
  # tools/graph_digest -- which shares no code with the solver beyond graphlib
  # -- agrees with both. Covers uniform, mesh, RMAT, and graphs round-tripped
  # through a GAPBS .wsg file.
  #
  # This deliberately builds *classic* Charm++ (multicore) rather than
  # Reconverse. Correctness is independent of the Converse layer, and a stock
  # build is fast and cacheable; Reconverse-specific behaviour is covered by
  # running scripts/verify.sh locally.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout charm_graph_code
        uses: actions/checkout@v7
        with:
          path: charm_graph_code

      - name: Checkout htram
        uses: actions/checkout@v7
        with:
          repository: UIUC-PPL/htram
          path: htram

      - name: Cache Charm++ build
        id: charm-cache
        uses: actions/cache@v6
        with:
          path: charm
          key: charm-multicore-${{ runner.os }}-v1

      - name: Build Charm++
        if: steps.charm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/charmplusplus/charm.git
          cd charm
          ./build charm++ multicore-linux-x86_64 --with-production -j"$(nproc)"

      - name: Run the verify gate
        working-directory: charm_graph_code
        env:
          # A multicore Charm build takes +p, not Reconverse's +ppn.
          SSSP_PE_FLAG: "+p"
        run: |
          export SSSP_MAKE_ARGS="CHARMC_SMP=$GITHUB_WORKSPACE/charm/bin/charmc HTRAM_DIR=$GITHUB_WORKSPACE/htram"
          scripts/verify.sh
